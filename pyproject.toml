[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runcycles-openai-agents"
version = "0.1.0"
description = "Cycles budget governance for OpenAI Agents SDK"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Cycles", email = "support@runcycles.io" },
]
keywords = ["cycles", "budget", "governance", "openai", "agents", "llm", "cost-control"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "runcycles>=0.2.0",
    "openai-agents>=0.1.0",
]

[project.urls]
Homepage = "https://runcycles.io"
Documentation = "https://runcycles.io"
Repository = "https://github.com/runcycles/cycles-openai-agents"
Issues = "https://github.com/runcycles/cycles-openai-agents/issues"
Changelog = "https://github.com/runcycles/cycles-openai-agents/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "pytest-mock>=3.12",
    "mypy>=1.0",
    "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/runcycles_openai_agents"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["runcycles", "runcycles.*", "agents", "agents.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["runcycles_openai_agents"]

[tool.coverage.report]
fail_under = 95
